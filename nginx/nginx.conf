# Fronts both the Next.js web app and the NestJS API on a shared origin, so
# browser fetch/websocket calls stay same-origin (no CORS).
#
# Entry points:
#   :80   — redirects everything to the canonical https:// origin.
#   :443  — https://kerektap.kz, the real public entrance.
#   :8002 — plain HTTP by IP, kept as a fallback/debug path.
#
# The certificate is still issued via a TLS-ALPN-01 challenge on :443 rather
# than the usual http-01 on :80 — that predates us taking over :80 (which
# used to belong to another project on this box) and there's no reason to
# churn a working renewal path. See README's HTTPS section.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  client_max_body_size 12m;
  proxy_read_timeout 90s;

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:3001;
  }

  # Shared by both server blocks below — keeps the two entry points from
  # drifting apart as routes change.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Everything arriving over plain HTTP — including bare-IP hits, which is
  # what the box answered with a different project until recently — is sent
  # to the canonical HTTPS origin. Redirecting to a fixed host rather than
  # $host on purpose: an IP or unknown-hostname request redirected to itself
  # would land on a certificate that doesn't match it.
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://kerektap.kz$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name kerektap.kz www.kerektap.kz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Socket.io (realtime order updates) — longer prefix wins over /api/
    # regardless of declaration order, so this must stay more specific.
    location /api/socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    # REST API + uploaded photos (LocalDiskProvider builds URLs as
    # {API_URL}/uploads/... and API_URL is set to .../api, so this one
    # prefix-strip rule covers both without a separate /uploads/ block).
    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 8002;
    server_name _;

    location /api/socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

# Fronts both the Next.js web app and the NestJS API on a shared origin, so
# browser fetch/websocket calls stay same-origin (no CORS).
#
# Two entry points, both serving the same routes:
#   :443  — https://kerektap.kz, the real public entrance.
#   :8002 — plain HTTP by IP, kept as a fallback/debug path.
#
# Port 80 is deliberately NOT used: it's occupied by another project on this
# box (taskbot, a catch-all vhost) and we agreed not to touch it. That means
# no http -> https redirect and no ACME http-01 challenge — the certificate
# is issued via TLS-ALPN-01 on :443 instead (see README's HTTPS section).
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  client_max_body_size 12m;
  proxy_read_timeout 90s;

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:3001;
  }

  # Shared by both server blocks below — keeps the two entry points from
  # drifting apart as routes change.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name kerektap.kz www.kerektap.kz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Socket.io (realtime order updates) — longer prefix wins over /api/
    # regardless of declaration order, so this must stay more specific.
    location /api/socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    # REST API + uploaded photos (LocalDiskProvider builds URLs as
    # {API_URL}/uploads/... and API_URL is set to .../api, so this one
    # prefix-strip rule covers both without a separate /uploads/ block).
    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 8002;
    server_name _;

    location /api/socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

# Конфиг Gitleaks: дефолтные правила + наши исключения.
[extend]
useDefault = true

# Тестовые файлы — заведомо фейковые ключи (tole_sk_test_v1_xxx и подобные для
# юнит-проверок), не рабочие секреты. Реальные ключи в git не попадают
# (.env в .gitignore). Секрет-сканер по тестам не гоняем.
[allowlist]
description = "Синтетические ключи в тестах"
paths = [
  '''apps/api/test/.*''',
]

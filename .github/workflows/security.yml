# Бесплатный слой безопасности — на каждый PR, без LLM и без внешних лимитов.
#
# Три независимых проверки, каждая ловит свой класс и падает сама:
#   deps     — уязвимые зависимости (npm audit);
#   semgrep  — статический анализ кода (инъекции, небезопасные паттерны);
#   secrets  — секреты в коде и в истории git (gitleaks).
#
# Это постоянная защита. Глубокий LLM-пентест (strix.yml) запускается вручную и
# редко — см. docs/security.md.

name: security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    name: Уязвимые зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Читает package-lock.json, установка не нужна. --omit=dev: в проде важны
      # только рабочие зависимости; dev-инструменты в рантайм не попадают.
      # Порог high: moderate на транзитивных пакетах слишком шумит и блокирует
      # PR по мелочам — до high дорастём осознанно.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: Статический анализ (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Наборы правил под наш стек. p/secrets ловит захардкоженные ключи в коде,
      # остальные — небезопасные паттерны Node/TypeScript. --error: ненулевой
      # код при находке, чтобы PR покраснел. SARIF кладём в артефакт всегда.
      - name: Semgrep scan
        run: |
          set +e
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --config p/nodejs \
            --config p/typescript \
            --sarif --output semgrep.sarif \
            --error --metrics=off
          echo "code=$?" >> "$GITHUB_ENV"
      - name: Отчёт в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
      - name: Итог
        run: |
          if [ "${code:-0}" != "0" ]; then
            echo "::error::Semgrep нашёл проблемы — смотрите артефакт semgrep-sarif"
            exit 1
          fi
          echo "Semgrep: чисто."

  secrets:
    name: Секреты в коде (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история: секрет мог быть закоммичен и «убран» позже — в истории
          # он остаётся и остаётся утечкой.
          fetch-depth: 0
      - name: Gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          set +e
          ./gitleaks detect --source . --redact -v \
            --report-format sarif --report-path gitleaks.sarif
          echo "code=$?" >> "$GITHUB_ENV"
      - name: Отчёт в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
      - name: Итог
        run: |
          if [ "${code:-0}" != "0" ]; then
            echo "::error::Gitleaks нашёл возможные секреты — смотрите артефакт gitleaks-sarif"
            exit 1
          fi
          echo "Gitleaks: секретов не найдено."
